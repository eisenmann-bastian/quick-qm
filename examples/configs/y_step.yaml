# Y scan by fixed step: 2.0, 2.5, 3.0 angstroms per axis pair.
rigid:
  include:
    - molecule_name: "^241$"
      selector: "^aromatic ring$"
      axis_type: "^aromatic_normal$"
flexible:
  include:
    - molecule_name: "^878$"
      selector: "^thiol$"
      axis_type: "^hydrogen_sigma$"
output_format: pair-files
output: scan_y_step
overwrite_output: false
grid_based_scan:
  y:
    scan_start: 2.0
    scan_end: 3.0
    scan_step: 0.5
    include_start: true
    include_end: true
