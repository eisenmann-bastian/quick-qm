[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "molecular-aligner"
version = "0.1.0"
description = "Derive molecular axes and align molecular structures"
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2024.9",
    "numpy>=1.23",
    "PyYAML>=6.0,<7",
    "molecular-selector @ git+https://github.com/eisenmann-bastian/molecular-selector.git",
    "molecular-utilities @ git+https://github.com/eisenmann-bastian/molecular-utilities.git",
]

[project.scripts]
molecule-axes = "aligner.axes:main"
molecular-aligner = "aligner.aligner:main"
molecular-aligner-select = "aligner.selector:main"
molecule-aligner = "aligner.aligner:main"
molecule-aligner-select = "aligner.selector:main"

[tool.setuptools.packages.find]
include = ["aligner*"]
namespaces = true
exclude = ["*.test*", "tests*"]

[tool.setuptools.package-data]
aligner = ["axes.config"]
